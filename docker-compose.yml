version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaflens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  fastapi:
    build: .
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  thingsboard:
    image: thingsboard/tb-ce:latest
    environment:
      TB_PG_DB_URL: jdbc:postgresql://postgres:5432/thingsboard
      TB_PG_DB_USER: postgres
      TB_PG_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
      - "1883:1883"
    depends_on:
      - postgres

volumes:
  pgdata:
